
services:
  temporal-postgres:
    image: postgres:16-alpine
    container_name: ats-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: ats-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: ats-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8080
    ports:
      - "8081:8080"
    depends_on:
      - temporal

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: ats-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres         
      POSTGRES_DB: ats_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ats-backend
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ats_db
      PLATFORM_NAME: Otter Hire
      CORS_ORIGINS: http://localhost.com:3000,http://app.localhost.com:3000,http://jobs.localhost.com:3000,http://smartats.in:3000,https://smartats.in,http://app.smartats.in:3000,https://app.smartats.in,http://jobs.smartats.in:3000,https://jobs.smartats.in
      APP_DOMAIN: ${APP_DOMAIN:-smartats.in}
      APP_SUBDOMAIN: app
      JOBS_SUBDOMAIN: jobs
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.smartats.in}
      TEMPORAL_SERVER_URL: temporal:7233
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      temporal:
        condition: service_started
    volumes:
      - ./apps/backend:/app
    command: sh -lc "alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  backend-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ats-backend-worker
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ats_db
      PLATFORM_NAME: Otter Hire
      CORS_ORIGINS: http://localhost.com:3000,http://app.localhost.com:3000,http://jobs.localhost.com:3000,http://smartats.in:3000,https://smartats.in,http://app.smartats.in:3000,https://app.smartats.in,http://jobs.smartats.in:3000,https://jobs.smartats.in
      APP_DOMAIN: ${APP_DOMAIN:-smartats.in}
      APP_SUBDOMAIN: app
      JOBS_SUBDOMAIN: jobs
      COOKIE_DOMAIN: ""
      BACKEND_URL: http://backend:8000
      TEMPORAL_SERVER_URL: temporal:7233
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      temporal:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    command: sh -lc "python -m app.temporal"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        NEXT_PUBLIC_PLATFORM_NAME: Otter Hire
        NEXT_PUBLIC_APP_SUBDOMAIN: app
        NEXT_PUBLIC_JOBS_SUBDOMAIN: jobs
        NEXT_PUBLIC_APP_ROOT_HOST: ${NEXT_PUBLIC_APP_ROOT_HOST:-smartats.in}
        NEXT_PUBLIC_SES_MAIL_DOMAIN: applications.smartats.in
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://smartats.in}
        NEXT_PUBLIC_TEMPORAL_UI_URL: ${NEXT_PUBLIC_TEMPORAL_UI_URL:-http://temporal.localhost.com:8081}
    container_name: ats-web
    environment:
      NEXT_PUBLIC_PLATFORM_NAME: Otter Hire
      NEXT_PUBLIC_APP_SUBDOMAIN: app
      NEXT_PUBLIC_JOBS_SUBDOMAIN: jobs
      NEXT_PUBLIC_APP_ROOT_HOST: ${NEXT_PUBLIC_APP_ROOT_HOST:-smartats.in}
      NEXT_PUBLIC_SES_MAIL_DOMAIN: applications.smartats.in
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://smartats.in}
      NEXT_PUBLIC_TEMPORAL_UI_URL: ${NEXT_PUBLIC_TEMPORAL_UI_URL:-http://temporal.localhost.com:8081}
      # Internal server-side URL — uses Docker network directly (fast, no host-gateway)
      NEXT_INTERNAL_API_BASE_URL: http://backend:8000
    extra_hosts:
      - "api.localhost.com:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/next.config.js:/app/apps/web/next.config.js
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/ui/src:/app/packages/ui/src
    depends_on:
      - backend


volumes:
  postgres_data:
