name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        run: |
          echo "BACKEND_IMAGE=${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:backend-${GITHUB_SHA}-amd64" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:web-${GITHUB_SHA}-amd64" >> "$GITHUB_ENV"

      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Deploy backend service
        if: steps.changes.outputs.backend == 'true'
        id: deploy_backend
        run: |
          arn="$(scripts/ecs_register_and_update.sh \
            "${{ vars.ECS_BACKEND_TASKDEF }}" \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.ECS_BACKEND_SERVICE }}" \
            "$BACKEND_IMAGE")"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Deploy worker service
        if: steps.changes.outputs.backend == 'true'
        id: deploy_worker
        run: |
          arn="$(scripts/ecs_register_and_update.sh \
            "${{ vars.ECS_WORKER_TASKDEF }}" \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.ECS_WORKER_SERVICE }}" \
            "$BACKEND_IMAGE")"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Wait for backend services
        if: steps.changes.outputs.backend == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_BACKEND_SERVICE }}" "${{ vars.ECS_WORKER_SERVICE }}"

      - name: Check backend health
        if: steps.changes.outputs.backend == 'true'
        run: |
          curl --fail --show-error --silent "${{ vars.API_HEALTHCHECK_URL }}"

      - name: Build and push web image
        if: steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}

      - name: Deploy web service
        if: steps.changes.outputs.web == 'true'
        id: deploy_web
        run: |
          arn="$(scripts/ecs_register_and_update.sh \
            "${{ vars.ECS_WEB_TASKDEF }}" \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.ECS_WEB_SERVICE }}" \
            "$WEB_IMAGE")"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Wait for web service
        if: steps.changes.outputs.web == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_WEB_SERVICE }}"

      - name: Check web route
        if: steps.changes.outputs.web == 'true'
        run: |
          curl --fail --show-error --silent "${{ vars.WEB_HEALTHCHECK_URL }}" > /dev/null

      - name: Prune old backend images
        if: steps.changes.outputs.backend == 'true'
        run: |
          scripts/ecr_prune_managed_tags.sh "${{ vars.ECR_REPOSITORY }}" "backend-" 3

      - name: Prune old web images
        if: steps.changes.outputs.web == 'true'
        run: |
          scripts/ecr_prune_managed_tags.sh "${{ vars.ECR_REPOSITORY }}" "web-" 3

      - name: No deployable changes
        if: steps.changes.outputs.backend != 'true' && steps.changes.outputs.web != 'true'
        run: echo "No deployable changes detected."

      - name: Workflow summary
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Backend changed: \`${{ steps.changes.outputs.backend }}\`"
            echo "- Web changed: \`${{ steps.changes.outputs.web }}\`"
            if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
              echo "- Backend image: \`${BACKEND_IMAGE}\`"
              echo "- Backend task def: \`${{ steps.deploy_backend.outputs.arn }}\`"
              echo "- Worker task def: \`${{ steps.deploy_worker.outputs.arn }}\`"
            fi
            if [ "${{ steps.changes.outputs.web }}" = "true" ]; then
              echo "- Web image: \`${WEB_IMAGE}\`"
              echo "- Web task def: \`${{ steps.deploy_web.outputs.arn }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
