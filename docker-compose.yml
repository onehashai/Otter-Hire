
services:
  postgres:
    image: postgres:16-alpine
    container_name: ats-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ats_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ats-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ats_db
      IS_PRODUCTION: "false"
      CORS_ORIGINS: http://app.localhost:3000,http://jobs.localhost:3000,http://api.localhost:8000
      JWT_SECRET_KEY: dev-secret-key-change-this
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      FRONTEND_BASE_URL: http://app.localhost:3000
      COOKIE_DOMAIN: ""
      MAILTRAP_HOST: sandbox.smtp.mailtrap.io
      MAILTRAP_PORT: 2525
      MAILTRAP_USERNAME: 4d1305c1a56091
      MAILTRAP_PASSWORD: 55ae258f81ce38
      MAILTRAP_FROM_EMAIL: no-reply@onehash.ai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    command: sh -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ats-web
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_SUBDOMAIN: app
      NEXT_PUBLIC_JOBS_SUBDOMAIN: jobs
      NEXT_PUBLIC_APP_ROOT_HOST: localhost:3000
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/ui:/app/packages/ui
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/web/.next


volumes:
  postgres_data:
