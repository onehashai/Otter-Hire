
services:
  temporal-postgres:
    image: postgres:16-alpine
    container_name: ats-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: ats-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: ats-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8080
      - TEMPORAL_UI_PUBLIC_PATH=/temporal-dashboard
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: ats-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ats_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ats-backend
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ats_db
      CORS_ORIGINS: http://app.localhost.com:3000,http://jobs.localhost.com:3000,http://api.localhost.com:8000
      APP_DOMAIN: localhost.com
      APP_SUBDOMAIN: app
      JOBS_SUBDOMAIN: jobs
      COOKIE_DOMAIN: ""
      TEMPORAL_SERVER_URL: temporal:7233
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      temporal:
        condition: service_started
    volumes:
      - ./apps/backend:/app
    command: sh -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  backend-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ats-backend-worker
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ats_db
      CORS_ORIGINS: http://app.localhost.com:3000,http://jobs.localhost.com:3000,http://api.localhost.com:8000
      APP_DOMAIN: localhost.com
      APP_SUBDOMAIN: app
      JOBS_SUBDOMAIN: jobs
      COOKIE_DOMAIN: ""
      INBOUND_INTERNAL_API_BASE_URL: http://backend:8000
      TEMPORAL_SERVER_URL: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      temporal:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    command: sh -lc "python -m app.workers.worker"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ats-web
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_SUBDOMAIN: app
      NEXT_PUBLIC_JOBS_SUBDOMAIN: jobs
      NEXT_PUBLIC_APP_ROOT_HOST: localhost.com:3000
      NEXT_PUBLIC_INBOUND_EMAIL_DOMAIN: inbound.smartats.in
      API_INTERNAL_URL: http://backend:8000
      TEMPORAL_UI_INTERNAL_URL: http://temporal-ui:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - temporal-ui
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/ui:/app/packages/ui
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/web/.next


volumes:
  postgres_data:
