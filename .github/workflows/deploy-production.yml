name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    env:
      CODEDEPLOY_APP_NAME: ${{ vars.CODEDEPLOY_APP_NAME }}
      CODEDEPLOY_WEB_DG: ${{ vars.CODEDEPLOY_WEB_DG }}
      CODEDEPLOY_BACKEND_DG: ${{ vars.CODEDEPLOY_BACKEND_DG }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve diff base per service
        id: base
        run: |
          git fetch --tags

          if git rev-parse "deployed/production/backend" >/dev/null 2>&1; then
            echo "backend_base=$(git rev-parse deployed/production/backend)" >> "$GITHUB_OUTPUT"
          else
            echo "backend_base=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse "deployed/production/web" >/dev/null 2>&1; then
            echo "web_base=$(git rev-parse deployed/production/web)" >> "$GITHUB_OUTPUT"
          else
            echo "web_base=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect backend changes
        id: backend_changes
        run: |
          if git diff --quiet "${{ steps.base.outputs.backend_base }}" "${{ github.sha }}" -- apps/backend/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect web changes
        id: web_changes
        run: |
          if git diff --quiet "${{ steps.base.outputs.web_base }}" "${{ github.sha }}" -- apps/web/ packages/ui/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        run: |
          echo "BACKEND_IMAGE=${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:backend-${GITHUB_SHA}-amd64" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:web-${GITHUB_SHA}-amd64" >> "$GITHUB_ENV"

      - name: Build and push backend image
        if: steps.backend_changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Deploy backend service
        if: steps.backend_changes.outputs.changed == 'true'
        id: deploy_backend
        run: |
          arn="$(scripts/ecs_register_and_update.sh \
            "${{ vars.ECS_BACKEND_TASKDEF }}" \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.ECS_BACKEND_SERVICE }}" \
            "$BACKEND_IMAGE" \
            register_only)"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Stop active backend CodeDeploy deployments
        if: steps.backend_changes.outputs.changed == 'true'
        run: |
          app_name="${CODEDEPLOY_APP_NAME:-otter-hire-prod-ecs}"
          dg_name="${CODEDEPLOY_BACKEND_DG:-otter-hire-prod-backend-dg}"
          active_ids="$(aws deploy list-deployments \
            --application-name "$app_name" \
            --deployment-group-name "$dg_name" \
            --include-only-statuses Created Queued InProgress \
            --query 'deployments' \
            --output text)"

          if [ -z "$active_ids" ] || [ "$active_ids" = "None" ]; then
            echo "No active backend deployments found."
            exit 0
          fi

          echo "Stopping active backend deployments: $active_ids"
          for id in $active_ids; do
            aws deploy stop-deployment --deployment-id "$id" --auto-rollback-enabled || true
          done

          for id in $active_ids; do
            while true; do
              status="$(aws deploy get-deployment --deployment-id "$id" --query 'deploymentInfo.status' --output text)"
              echo "Deployment $id status: $status"
              case "$status" in
                Succeeded|Failed|Stopped) break ;;
              esac
              sleep 10
            done
          done

      - name: Deploy backend via CodeDeploy
        if: steps.backend_changes.outputs.changed == 'true'
        id: codedeploy_backend
        run: |
          app_name="${CODEDEPLOY_APP_NAME:-otter-hire-prod-ecs}"
          dg_name="${CODEDEPLOY_BACKEND_DG:-otter-hire-prod-backend-dg}"
          deployment_id="$(
            aws deploy create-deployment \
              --application-name "$app_name" \
              --deployment-group-name "$dg_name" \
              --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":\"{\\\"version\\\":1,\\\"Resources\\\":[{\\\"TargetService\\\":{\\\"Type\\\":\\\"AWS::ECS::Service\\\",\\\"Properties\\\":{\\\"TaskDefinition\\\":\\\"${{ steps.deploy_backend.outputs.arn }}\\\",\\\"LoadBalancerInfo\\\":{\\\"ContainerName\\\":\\\"backend\\\",\\\"ContainerPort\\\":8000}}}}]}\"}}\" \
              --query 'deploymentId' \
              --output text
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Deploy worker service
        if: steps.backend_changes.outputs.changed == 'true'
        id: deploy_worker
        run: |
          arn="$(scripts/ecs_register_and_update.sh \
            "${{ vars.ECS_WORKER_TASKDEF }}" \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.ECS_WORKER_SERVICE }}" \
            "$BACKEND_IMAGE")"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Wait for worker service
        if: steps.backend_changes.outputs.changed == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_WORKER_SERVICE }}"

      - name: Wait for backend deployment
        if: steps.backend_changes.outputs.changed == 'true'
        run: |
          deployment_id="${{ steps.codedeploy_backend.outputs.deployment_id }}"
          while true; do
            status="$(aws deploy get-deployment --deployment-id "$deployment_id" --query 'deploymentInfo.status' --output text)"
            echo "Backend CodeDeploy status: $status"
            if [ "$status" = "Succeeded" ]; then
              break
            fi
            if [ "$status" = "Failed" ] || [ "$status" = "Stopped" ]; then
              aws deploy get-deployment --deployment-id "$deployment_id" --output json
              exit 1
            fi
            sleep 10
          done

      - name: Check backend health
        if: steps.backend_changes.outputs.changed == 'true'
        run: |
          curl --fail --show-error --silent "${{ vars.API_HEALTHCHECK_URL }}"

      - name: Tag backend deployed
        if: steps.backend_changes.outputs.changed == 'true'
        run: |
          git tag -f deployed/production/backend "${{ github.sha }}"
          git push origin -f refs/tags/deployed/production/backend

      - name: Build and push web image
        if: steps.web_changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            NEXT_PUBLIC_APP_SUBDOMAIN=${{ vars.NEXT_PUBLIC_APP_SUBDOMAIN }}
            NEXT_PUBLIC_JOBS_SUBDOMAIN=${{ vars.NEXT_PUBLIC_JOBS_SUBDOMAIN }}
            NEXT_PUBLIC_APP_ROOT_HOST=${{ vars.NEXT_PUBLIC_APP_ROOT_HOST }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SES_MAIL_DOMAIN=${{ vars.NEXT_PUBLIC_SES_MAIL_DOMAIN }}
            NEXT_PUBLIC_TEMPORAL_UI_URL=${{ vars.NEXT_PUBLIC_TEMPORAL_UI_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}

      - name: Deploy web service
        if: steps.web_changes.outputs.changed == 'true'
        id: deploy_web
        run: |
          arn="$(scripts/ecs_register_and_update.sh \
            "${{ vars.ECS_WEB_TASKDEF }}" \
            "${{ vars.ECS_CLUSTER }}" \
            "${{ vars.ECS_WEB_SERVICE }}" \
            "$WEB_IMAGE" \
            register_only)"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Stop active web CodeDeploy deployments
        if: steps.web_changes.outputs.changed == 'true'
        run: |
          app_name="${CODEDEPLOY_APP_NAME:-otter-hire-prod-ecs}"
          dg_name="${CODEDEPLOY_WEB_DG:-otter-hire-prod-web-dg}"
          active_ids="$(aws deploy list-deployments \
            --application-name "$app_name" \
            --deployment-group-name "$dg_name" \
            --include-only-statuses Created Queued InProgress \
            --query 'deployments' \
            --output text)"

          if [ -z "$active_ids" ] || [ "$active_ids" = "None" ]; then
            echo "No active web deployments found."
            exit 0
          fi

          echo "Stopping active web deployments: $active_ids"
          for id in $active_ids; do
            aws deploy stop-deployment --deployment-id "$id" --auto-rollback-enabled || true
          done

          for id in $active_ids; do
            while true; do
              status="$(aws deploy get-deployment --deployment-id "$id" --query 'deploymentInfo.status' --output text)"
              echo "Deployment $id status: $status"
              case "$status" in
                Succeeded|Failed|Stopped) break ;;
              esac
              sleep 10
            done
          done

      - name: Deploy web via CodeDeploy
        if: steps.web_changes.outputs.changed == 'true'
        id: codedeploy_web
        run: |
          app_name="${CODEDEPLOY_APP_NAME:-otter-hire-prod-ecs}"
          dg_name="${CODEDEPLOY_WEB_DG:-otter-hire-prod-web-dg}"
          deployment_id="$(
            aws deploy create-deployment \
              --application-name "$app_name" \
              --deployment-group-name "$dg_name" \
              --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":\"{\\\"version\\\":1,\\\"Resources\\\":[{\\\"TargetService\\\":{\\\"Type\\\":\\\"AWS::ECS::Service\\\",\\\"Properties\\\":{\\\"TaskDefinition\\\":\\\"${{ steps.deploy_web.outputs.arn }}\\\",\\\"LoadBalancerInfo\\\":{\\\"ContainerName\\\":\\\"web\\\",\\\"ContainerPort\\\":3000}}}}]}\"}}\" \
              --query 'deploymentId' \
              --output text
          )"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for web deployment
        if: steps.web_changes.outputs.changed == 'true'
        run: |
          deployment_id="${{ steps.codedeploy_web.outputs.deployment_id }}"
          while true; do
            status="$(aws deploy get-deployment --deployment-id "$deployment_id" --query 'deploymentInfo.status' --output text)"
            echo "Web CodeDeploy status: $status"
            if [ "$status" = "Succeeded" ]; then
              break
            fi
            if [ "$status" = "Failed" ] || [ "$status" = "Stopped" ]; then
              aws deploy get-deployment --deployment-id "$deployment_id" --output json
              exit 1
            fi
            sleep 10
          done

      - name: Check web health
        if: steps.web_changes.outputs.changed == 'true'
        run: |
          curl --fail --show-error --silent "${{ vars.WEB_HEALTHCHECK_URL }}" > /dev/null

      - name: Tag web deployed
        if: steps.web_changes.outputs.changed == 'true'
        run: |
          git tag -f deployed/production/web "${{ github.sha }}"
          git push origin -f refs/tags/deployed/production/web

      - name: Prune old backend images
        if: steps.backend_changes.outputs.changed == 'true'
        run: |
          scripts/ecr_prune_managed_tags.sh "${{ vars.ECR_REPOSITORY }}" "backend-" 3

      - name: Prune old web images
        if: steps.web_changes.outputs.changed == 'true'
        run: |
          scripts/ecr_prune_managed_tags.sh "${{ vars.ECR_REPOSITORY }}" "web-" 3

      - name: No deployable changes
        if: steps.backend_changes.outputs.changed != 'true' && steps.web_changes.outputs.changed != 'true'
        run: echo "No deployable changes detected."

      - name: Workflow summary
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Backend changed: \`${{ steps.backend_changes.outputs.changed }}\`"
            echo "- Web changed: \`${{ steps.web_changes.outputs.changed }}\`"
            if [ "${{ steps.backend_changes.outputs.changed }}" = "true" ]; then
              echo "- Backend image: \`${BACKEND_IMAGE}\`"
              echo "- Backend task def: \`${{ steps.deploy_backend.outputs.arn }}\`"
              echo "- Backend deployment: \`${{ steps.codedeploy_backend.outputs.deployment_id }}\`"
              echo "- Worker task def: \`${{ steps.deploy_worker.outputs.arn }}\`"
            fi
            if [ "${{ steps.web_changes.outputs.changed }}" = "true" ]; then
              echo "- Web image: \`${WEB_IMAGE}\`"
              echo "- Web task def: \`${{ steps.deploy_web.outputs.arn }}\`"
              echo "- Web deployment: \`${{ steps.codedeploy_web.outputs.deployment_id }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
