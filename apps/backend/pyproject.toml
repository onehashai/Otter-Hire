[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

# Entrypoints require `app.core.logging` before `import sentry`; Ruff's isort
# would move third-party imports above that pair.
[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["I001"]
"app/temporal/__main__.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
